# Every secret and every environment-specific value comes from an environment variable.
# See vc-infra/.env.example for the full list; nothing sensitive is stored in this repository.
spring:
  application:
    name: vc-api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    co.visioncare.vcapi: INFO
